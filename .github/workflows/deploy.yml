# A honlap felépítése és közzététele GitHub Pages-en.
# Minden main branchre érkező módosítás után lefut — akkor is, ha a
# módosítás a tartalomkezelőből (admin felület) érkezett.
name: Honlap építése és közzététele

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Képfeldolgozó telepítése
        run: pip install --disable-pip-version-check Pillow

      - name: Honlap generálása
        run: python3 src/build.py

      - name: Hivatkozások ellenőrzése
        run: python3 src/checklinks.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
