# Tartalomkezelő beállításai (Sveltia CMS / Decap CMS)
# A "repo" értékét a build.py automatikusan kitölti a git távoli tárolóból.

backend:
  name: github
  repo: __REPO__
  branch: main

site_url: https://pomazszszk.hu
display_url: https://pomazszszk.hu
locale: hu
publish_mode: simple

# A feltöltött képek helye a tárolóban, illetve a honlapon
media_folder: "assets/img/hirek"
public_folder: "/assets/img/hirek"

collections:
  - name: hirek
    label: Hírek
    label_singular: Hír
    description: >-
      Egy hír = egy bejegyzés. Mentés után a honlap 1–2 percen belül
      automatikusan frissül.
    folder: content/hirek
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Kiemelt hírek
        field: highlight
        pattern: true
    fields:
      - name: title
        label: Cím
        widget: string
        hint: Ez jelenik meg a hírlistában és a hír saját oldalának tetején.

      - name: date
        label: Dátum
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        hint: A hírek dátum szerint, a legfrissebbel kezdve jelennek meg.

      - name: excerpt
        label: Kivonat
        widget: text
        hint: >-
          1–2 mondat, ez látszik a hírlistában és a főoldalon. Ha üresen hagyod,
          a szöveg eleje kerül ide.
        required: false

      - name: image
        label: Borítókép
        widget: image
        required: false
        hint: Nem kötelező. Fekvő tájolású kép a legszebb.

      - name: image_alt
        label: Kép rövid leírása
        widget: string
        required: false
        hint: >-
          Látássérült látogatóknak és a felolvasóprogramoknak szól.
          Például „Adventi koszorúk az asztalon”.

      - name: highlight
        label: Kiemelt hír („Fontos” címkével)
        widget: boolean
        default: false
        required: false

      - name: link_label
        label: Gomb felirata (nem kötelező)
        widget: string
        required: false
        hint: Például „Képek a galériában”.

      - name: link_href
        label: Gomb hivatkozása (nem kötelező)
        widget: string
        required: false
        hint: Például kepgaleria.html vagy https://…

      - name: body
        label: A hír szövege
        widget: markdown

  - name: galeria
    label: Képgaléria
    label_singular: Album
    description: >-
      Egy album = egy esemény. Töltsd fel a fényképeket, és a honlapon
      megjelenik hozzájuk egy nagyítható képnézegető.
    folder: content/galeria
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    summary: "{{year}} — {{title}}"
    sortable_fields: [date, title]
    media_folder: "/assets/img/galeria"
    public_folder: "/assets/img/galeria"
    fields:
      - name: title
        label: Album neve
        widget: string
        hint: Például „Karácsony” vagy „Majális”.

      - name: year
        label: Év
        widget: string
        hint: Ez jelenik meg a borítón, a cím alatt.

      - name: date
        label: Dátum
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        hint: Az albumok dátum szerint, a legfrissebbel kezdve sorakoznak.

      - name: cover
        label: Borítókép
        widget: image
        required: false
        hint: >-
          Ez látszik a galéria főoldalán. Ha üresen hagyod, az első feltöltött
          fénykép lesz a borító.

      - name: photos
        label: Fényképek
        label_singular: Fénykép
        widget: list
        required: false
        summary: "{{fields.caption}}"
        hint: >-
          Az „Add Fénykép” gombbal adhatsz hozzá képeket. Nyugodtan tölthetsz fel
          telefonnal készült, nagy fájlokat — a honlap automatikusan legyártja
          belőlük a kicsinyített és a nagy nézetet.
        fields:
          - name: image
            label: Kép
            widget: image
          - name: caption
            label: Képaláírás
            widget: string
            required: false
            hint: Nem kötelező, de segít a látássérült látogatóknak.

      - name: external_url
        label: Régi galéria hivatkozása
        widget: string
        required: false
        hint: >-
          Csak a korábbi honlapról átvett albumoknál kell. Ha nincs feltöltött
          fénykép, a borítóra kattintva ide jut a látogató.

      - name: body
        label: Album leírása
        widget: markdown
        required: false
