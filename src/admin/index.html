<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tartalomkezelő – Szociális Szolgáltatási Központ, Pomáz</title>
</head>
<body>
  <!--
    Sveltia CMS — a Decap CMS modern újraírása, ugyanazzal a config.yml-lel.
    Azért ezt használjuk, mert GitHub Pages-en bejelentkezni is tud
    személyes hozzáférési kulccsal (PAT), OAuth-kiszolgáló nélkül.

    A script-hivatkozás verzióra van rögzítve, és SRI-ellenőrzéssel (integrity)
    van ellátva: ha a CDN-en a fájl bármit változna, a böngésző NEM tölti be.
    Verziófrissítéskor az integrity értéket is újra kell számolni:
      curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A

    Ha mégis az eredeti Decap CMS-t szeretnéd, cseréld ki az alábbi sort erre:
    <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>
    (a Decap GitHub-belépéshez viszont külön OAuth-kiszolgáló kell)
  -->
  <script src="https://unpkg.com/@sveltia/cms@0.205.1/dist/sveltia-cms.js"
          integrity="sha384-UzAlVLAzKo+h2mRNoZJLArfU1moRE4wy/2Lc/BpfbIBS+7o6g2FK0j1j5lfVZmoO"
          crossorigin="anonymous"></script>
</body>
</html>
